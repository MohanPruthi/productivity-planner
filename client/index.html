<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Set the saved theme before the CSS paints, so the page never flashes the default look (see src/theme.js)
      try {
        var t = localStorage.getItem('ui_theme');
        if (/^[a-z-]+$/.test(t)) document.documentElement.dataset.theme = t;
      } catch (e) { /* storage unavailable: theme.js falls back to classic */ }
    </script>
    <title>Productivity Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
